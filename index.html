<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>シフトボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 打刻カードのような帳票。上に固定ヘッダーとタブ、カレンダーと「その日の詳細」を左右に並べ、スマホでは縦積み */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --sunken: #F6F8FB;
  --ink: #161E2E;
  --muted: #5A6477;
  --line: #D8DEE8;
  --accent: #2148C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EAFB;
  --today: #F2BE22;
  --ok: #1D8455;
  --part: #A86B0C;
  --ng: #BF3A34;
  --sun: #BF3A34;
  --sat: #2148C9;
  --c0: #2F6FE4; --c1: #E0663A; --c2: #1E9A6A; --c3: #A453D6;
  --c4: #D1A114; --c5: #D94C8A; --c6: #2A9FB8; --c7: #6B7A8F;
  --f-display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131C; --surface: #161D29; --sunken: #111722; --ink: #E6EAF1; --muted: #98A2B4; --line: #283244;
    --accent: #7E9CFF; --accent-ink: #0E131C; --accent-soft: #1D2846; --today: #E3B421;
    --ok: #4CC38A; --part: #E3A54A; --ng: #F0736A; --sun: #F0736A; --sat: #8FA9FF;
    --c0: #6F9BFF; --c1: #F08A5E; --c2: #46C08E; --c3: #C084F0; --c4: #E8C14A; --c5: #F27AAE; --c6: #4FC2D9; --c7: #9AA8BC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131C; --surface: #161D29; --sunken: #111722; --ink: #E6EAF1; --muted: #98A2B4; --line: #283244;
  --accent: #7E9CFF; --accent-ink: #0E131C; --accent-soft: #1D2846; --today: #E3B421;
  --ok: #4CC38A; --part: #E3A54A; --ng: #F0736A; --sun: #F0736A; --sat: #8FA9FF;
  --c0: #6F9BFF; --c1: #F08A5E; --c2: #46C08E; --c3: #C084F0; --c4: #E8C14A; --c5: #F27AAE; --c6: #4FC2D9; --c7: #9AA8BC;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .02em; }
.brand .store { color: var(--muted); font-weight: 500; }
.acct { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.gate { max-width: 560px; margin: 24px auto; display: flex; flex-direction: column; gap: 12px; }
.gate h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.gate p { margin: 0; }
.gate-admin { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.uidbox { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--sunken); color: var(--ink); min-width: 0; flex: 1 1 16em; }
.invite { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; grid-column: 2 / 4; }
.invite input { flex: 1 1 14em; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: var(--sunken); color: var(--ink); font-family: var(--f-mono); }
.role { font-size: 12px; letter-spacing: .08em; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.role.admin { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 14px 10px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

main { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.banner { border: 1px solid var(--line); background: var(--sunken); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.warn { border-color: var(--part); }
.banner.err { border-color: var(--ng); }

.btn { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
.btn:hover { background: var(--sunken); }
a.btn { display: inline-block; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav .arrow { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.period { font-family: var(--f-display); font-weight: 400; font-size: 20px; min-width: 9.5em; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* calendar layout */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 960px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }

.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.month .wd { font-size: 12px; text-align: center; padding: 4px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--sunken); color: var(--muted); font-weight: 700; }
.month .wd.d0 { color: var(--sun); } .month .wd.d6 { color: var(--sat); }
.cell { min-height: 104px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; padding: 4px 5px 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; position: relative; }
.cell:hover { background: var(--sunken); }
.cell.out { background: var(--sunken); }
.cell.out .dnum { opacity: .45; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.dnum { font-family: var(--f-mono); font-weight: 600; font-size: 13px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cell.d0 .dnum { color: var(--sun); } .cell.d6 .dnum { color: var(--sat); }
.cell.today .dnum { background: var(--today); color: #161E2E; }
.chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip { display: block; font-size: 11.5px; line-height: 1.35; padding: 1px 5px; border-radius: 4px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.open { --c: var(--ng); border-left-style: dashed; background: transparent; outline: 1px dashed color-mix(in srgb, var(--ng) 45%, transparent); color: var(--ng); }
.open-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.chip i { font-style: normal; font-family: var(--f-mono); color: var(--muted); font-size: 10.5px; }
.more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.rq { margin-top: auto; display: flex; gap: 6px; font-size: 10.5px; font-family: var(--f-mono); }
.ok { color: var(--ok); } .part { color: var(--part); } .ng { color: var(--ng); }
.short { display: block; font-size: 11px; line-height: 1.35; color: #fff; background: var(--ng); border-radius: 4px; padding: 1px 5px; font-weight: 700; overflow-wrap: anywhere; }
.short .det { font-family: var(--f-mono); font-weight: 600; }
.cell.has-short { box-shadow: inset 0 -3px 0 var(--ng); }
.cell.has-short.sel { box-shadow: inset 0 0 0 2px var(--accent), inset 0 -4px 0 var(--ng); }
.shortzone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ng) 18%, transparent); border-left: 2px solid var(--ng); border-right: 2px solid var(--ng); }
.need-ok { color: var(--ok); font-weight: 700; }
.need-ng { color: var(--ng); font-weight: 700; }
.needrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 5.5em auto; gap: 8px; align-items: end; }
.rqcell { min-height: 118px; }
.rqchip { display: block; font-size: 11.5px; line-height: 1.4; padding: 0 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rqchip b { margin-right: 2px; }
.rqchip.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.rqchip.part { background: color-mix(in srgb, var(--part) 14%, transparent); }
.rqchip.ng { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ng) 60%, transparent); }
.rqchip i { font-style: normal; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.rqcount { font-size: 11px; font-family: var(--f-mono); color: var(--muted); }
.rqcount.lack { color: var(--ng); font-weight: 700; }
.plan-day { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.plan-day:last-child { border-bottom: 0; }
.plan-list { max-height: 360px; overflow-y: auto; }
.week tfoot tr.shortrow td { color: var(--ng); font-weight: 700; background: color-mix(in srgb, var(--ng) 8%, var(--surface)); }
@media (max-width: 640px) {
  .cell { min-height: 64px; padding: 3px; }
  .chip { font-size: 0; padding: 0; height: 6px; border-left: 0; background: var(--c); border-radius: 3px; }
  .chip i { display: none; }
  .chips { gap: 2px; }
  .rq { display: none; }
  .short .det { display: none; }
  .rqcell { min-height: 64px; }
  .rqcell .rqchip { display: none; }
  .short { font-size: 9.5px; padding: 0 2px; text-align: center; }
  .needrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .period { font-size: 17px; min-width: 0; }
}

/* week table */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.week th, .week td { border: 1px solid var(--line); padding: 6px; vertical-align: top; }
.week thead th { background: var(--sunken); font-size: 12.5px; font-weight: 700; }
.week thead th button { border: 0; background: none; font-weight: 700; width: 100%; padding: 0; }
.week thead th.sel { box-shadow: inset 0 -3px 0 var(--accent); }
.week th.name { text-align: left; min-width: 7em; white-space: nowrap; }
.week td { min-width: 84px; font-size: 13px; }
.week td.sel { background: var(--accent-soft); }
.wshift { font-family: var(--f-mono); font-size: 12.5px; border-left: 3px solid var(--c); padding-left: 5px; white-space: nowrap; }
.wreq { font-size: 12px; opacity: .8; }
.week tfoot td { background: var(--sunken); font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: middle; }

/* day panel */
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.day-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.section-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--muted); margin: 16px 0 8px; }
.timeline { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); padding: 22px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.ticks { position: absolute; inset: 0 8px; pointer-events: none; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.tick span { position: absolute; top: 3px; left: 2px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.bar { position: relative; height: 22px; }
.bar > div { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--c); color: #fff; font-size: 11px; padding: 0 6px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; min-width: 4px; }
.empty-tl { font-size: 13px; color: var(--muted); padding: 4px 0 2px; }
.slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.slist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.slist .who { font-weight: 700; }
.slist .meta { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
.empty-box { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.empty-box summary { cursor: pointer; font-weight: 700; }
.empty-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.empty-list li { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.empty-none { font-size: 13.5px; margin: 10px 0 0; line-height: 1.9; }
.prio-list { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; max-width: 26em; }
.prio-list li { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }
.prio-list .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prio-n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 2.6em; }
.linkbtn { background: none; border: 0; padding: 0 2px; color: var(--accent, #2148C9); text-decoration: underline; cursor: pointer; font: inherit; min-width: 5.5em; text-align: left; }
.reqgrp { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.reqline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mark { font-weight: 700; width: 1.4em; text-align: center; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form .full { grid-column: 1 / -1; }
label.f, span.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; min-width: 0; }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; color: var(--ink); width: 100%; min-width: 0; }
.f textarea { min-height: 64px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }

.gcal { margin-top: 18px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
.gcal h3 { font-size: 14px; }
.msg { font-size: 13px; padding: 6px 10px; border-radius: 6px; background: var(--sunken); }
.msg.err { color: var(--ng); }
.msg.ok { color: var(--ok); }

/* requests */
.reqgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.rday { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; }
.rday .n { font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.rday .w { font-size: 11px; color: var(--muted); }
.rday .m { font-size: 18px; font-weight: 700; line-height: 1.1; min-height: 1.1em; }
.rday.k-ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.rday.k-part { border-color: var(--part); background: color-mix(in srgb, var(--part) 10%, var(--surface)); }
.rday.k-ng { border-color: var(--ng); background: color-mix(in srgb, var(--ng) 8%, var(--surface)); }
.rday.blank { visibility: hidden; }
.rday.d0 .n { color: var(--sun); } .rday.d6 .n { color: var(--sat); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.partlist { display: flex; flex-direction: column; gap: 6px; }
.partrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.partrow input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); }
.matrix th, .matrix td { border: 1px solid var(--line); padding: 3px 4px; text-align: center; font-size: 12.5px; }
.matrix thead th { background: var(--sunken); font-family: var(--f-mono); font-weight: 600; min-width: 26px; }
.matrix th.name { text-align: left; white-space: nowrap; font-family: var(--f-body); padding-inline: 8px; }
.status { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.status.done { border-color: var(--ok); color: var(--ok); }

/* summary */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--sunken); border-radius: 8px; padding: 10px 12px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 22px; font-weight: 400; }
.sum th, .sum td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.sum th { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 700; }
.sum td.name, .sum th.name { text-align: left; font-family: var(--f-body); }
.sum tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--ink); }
.hbar { height: 6px; border-radius: 3px; background: var(--c); margin-top: 4px; }

/* staff */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; background: var(--c); }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.toast.err { background: var(--ng); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>シフトボード</h1><span class="store" id="store-name"></span><span class="acct" id="acct"><span class="role">読み込み中</span></span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="main"></main>
<div id="toast-root"></div>

<script>
"use strict";
const GCAL = "Google Calendar";
window.addEventListener("hashchange", () => { if (/^#join=/.test(location.hash)) location.reload(); });
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const TABS = [["cal", "カレンダー"], ["req", "希望シフト"], ["sum", "勤務時間・給料"], ["staff", "スタッフ・設定"]];
const MARK = { ok: "〇", part: "△", ng: "×" };
const CYCLE = { "": "ok", ok: "part", part: "ng", ng: "" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -d.getDay());
const toMin = t => { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return NaN; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const clock = m => { m = Math.round(m); return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`; };
// お店の設定の開始・終了は「時」の数値（8.5 = 8:30、25 = 翌 1:00）で保存し、画面では HH:MM で入力する
const hoursToHm = v => typeof v === "string" && v.includes(":") ? v : clock((Number(v) || 0) * 60);
const hmToMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || "")); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const hrs = m => `${Math.floor(m / 60)}:${pad(Math.round(m % 60))}`;
const shortT = t => t && t.endsWith(":00") ? String(Number(t.slice(0, 2))) : (t || "");
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const md = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

/* 日本の祝日（振替休日・国民の休日を含む）。春分・秋分は近似式 */
function baseHoliday(y, m, d) {
  const nthMon = n => { const w = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - w) % 7) + (n - 1) * 7; };
  const eq = c => Math.floor(c + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  const fixed = { "1-1": "元日", "2-11": "建国記念の日", "2-23": "天皇誕生日", "4-29": "昭和の日", "5-3": "憲法記念日", "5-4": "みどりの日", "5-5": "こどもの日", "8-11": "山の日", "11-3": "文化の日", "11-23": "勤労感謝の日" };
  if (fixed[`${m}-${d}`]) return fixed[`${m}-${d}`];
  if (m === 1 && d === nthMon(2)) return "成人の日";
  if (m === 7 && d === nthMon(3)) return "海の日";
  if (m === 9 && d === nthMon(3)) return "敬老の日";
  if (m === 10 && d === nthMon(2)) return "スポーツの日";
  if (m === 3 && d === eq(20.8431)) return "春分の日";
  if (m === 9 && d === eq(23.2488)) return "秋分の日";
  return "";
}
function jpHoliday(dt) {
  const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
  const b = baseHoliday(y, m, d); if (b) return b;
  // 振替休日: 日曜の祝日から続く祝日の翌日
  for (let k = 1; k <= 7; k++) { const p = addDays(dt, -k); if (!baseHoliday(p.getFullYear(), p.getMonth() + 1, p.getDate())) break; if (p.getDay() === 0) return "振替休日"; }
  // 国民の休日: 祝日に挟まれた平日
  const a = addDays(dt, -1), c = addDays(dt, 1);
  if (dt.getDay() !== 0 && baseHoliday(a.getFullYear(), a.getMonth() + 1, a.getDate()) && baseHoliday(c.getFullYear(), c.getMonth() + 1, c.getDate())) return "国民の休日";
  return "";
}

function span(s) { const a = toMin(s.start); let b = toMin(s.end); if (isNaN(a) || isNaN(b)) return null; if (b <= a) b += 1440; return { a, b }; }
const ov = (a, b, c, d) => Math.max(0, Math.min(b, d) - Math.max(a, c));
// 実働・深夜(22-5時)・残業(1日8時間超)を分で返す
function calc(s) {
  const sp = span(s); if (!sp) return { work: 0, night: 0, over: 0 };
  const total = sp.b - sp.a, brk = Math.min(brkOf(s), total), work = total - brk;
  const night = Math.min(work, ov(sp.a, sp.b, 0, 300) + ov(sp.a, sp.b, 1320, 1740) + ov(sp.a, sp.b, 2760, 3180));
  return { work, night, over: Math.max(0, work - 480) };
}
// 時給とメールは管理者だけが読める private/<staffId> に置く（古いデータは staff 側にある場合も読む）
const wageOf = st => { const p = S.priv[st.id]; return p && p.wage != null ? p.wage : (st.wage ?? null); };
const desiredOf = st => { const p = S.priv[st.id]; return p && p.desiredPay != null ? p.desiredPay : null; };
// 自動で組むときの優先順位（1番が先頭）。スタッフには見せないので private/_priority に置く
const prioIds = () => { const o = ((S.priv._priority || {}).order || []).filter(id => staffById(id)); return [...o, ...S.staff.map(st => st.id).filter(id => !o.includes(id))]; };
const rankOf = id => prioIds().indexOf(id) + 1;
const emailOf = st => { const p = S.priv[st.id]; return (p && p.email) || st.email || null; };
const payOf = (c, wage) => { const w = Number(wage) || 0; return (c.work * w + c.night * w * 0.25 + c.over * w * 0.25) / 60; };
// 休憩の決まり（お店の設定で変えられる）。「勤務が overMin 分を超えたら breakMin 分休憩」。初期値は労働基準法の最低ライン
const DEFAULT_BREAK_RULES = [{ overMin: 360, breakMin: 45 }, { overMin: 480, breakMin: 60 }];
const breakRules = () => Array.isArray(S.settings.breakRules) ? S.settings.breakRules : DEFAULT_BREAK_RULES;
const fmtDur = m => m % 60 ? `${Math.floor(m / 60)}時間${m % 60}分` : `${m / 60}時間`;
const breakRulesText = () => { const r = breakRules(); return r.length ? r.map(x => `${fmtDur(x.overMin)}超で${x.breakMin}分`).join("、") : "休憩なし"; };
function suggestBreak(start, end) {
  const sp = span({ start, end }); if (!sp) return 0;
  const t = sp.b - sp.a; let b = 0;
  for (const r of breakRules()) if (t > r.overMin) b = Math.max(b, r.breakMin);
  return b;
}
// シフトの休憩: 手で決めていない（breakAuto）シフトは、今の休憩の決まりで計算する
const brkOf = s => s.breakAuto ? suggestBreak(s.start, s.end) : (Number(s.breakMin) || 0);

const pref = { get(k, d) { try { return localStorage.getItem("sb." + k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("sb." + k, v); } catch {} } };

const now = new Date();
const S = {
  dbState: "loading", dbErr: "", db: null, auth: null, authUser: null, adminEmail: "", gate: null,
  admin: false, role: "guest", me: "", tokens: {}, invite: null,
  staff: [], shifts: [], reqs: [], settings: { storeName: "", deadlineDay: 20, open: 8, close: 24 },
  tab: pref.get("tab", "cal"), calMode: pref.get("calMode", "month"), sel: ymd(now),
  form: blankForm(), confirmDel: null, emptyFuture: true, emptyOpen: true,
  req: { staffId: pref.get("me", ""), days: {}, note: "", dirty: false },
  sf: { id: null, name: "", wage: "", color: 0, email: "", desired: "" }, setf: null, priv: {},
  staffing: { byDow: {} }, need: null, needDow: 1, dayMemos: {}, dmDraft: null, openSlots: {},
  auto: { skipPast: true, extend: false, redo: true, prio: true, plan: null, running: false, msg: null },
  gcal: { who: null },
  toast: null,
};
function blankForm() { return { editing: null, staffId: "", start: "10:00", end: "17:00", breakMin: 45, breakTouched: false, note: "" }; }
const selDate = () => parseYmd(S.sel);
const monthFirst = () => { const d = selDate(); return new Date(d.getFullYear(), d.getMonth(), 1); };
const curYm = () => ymOf(selDate());
const staffById = id => S.staff.find(s => s.id === id);
const colorVar = st => `--c:var(--c${(st && st.color) || 0})`;
const nameOf = id => staffById(id)?.name || "（削除済み）";
const byStart = (a, b) => (toMin(a.start) - toMin(b.start)) || nameOf(a.staffId).localeCompare(nameOf(b.staffId), "ja");
const shiftsOn = ds => S.shifts.filter(s => s.date === ds).sort(byStart);
const shiftsInMonth = () => { const k = curYm(); return S.shifts.filter(s => s.date.startsWith(k)).sort((a, b) => a.date.localeCompare(b.date) || byStart(a, b)); };
const reqOf = staffId => S.reqs.find(r => r.staffId === staffId && r.month === curYm());
// 希望の「1 日最低何時間」（分）と「週に何日休みたいか」。未指定は 0 / null
const minWorkOf = staffId => { const r = reqOf(staffId); return Math.round((Number(r && r.minHours) || 0) * 60); };
const offWeekOf = staffId => { const r = reqOf(staffId), n = r && r.offPerWeek; return n === "" || n == null || isNaN(Number(n)) ? null : Number(n); };
// 月曜はじまりの週（ds を含む週の月〜日の日付）
const monWeek = ds => { const d = parseYmd(ds), m = addDays(d, -((d.getDay() + 6) % 7)); return [...Array(7)].map((_, i) => ymd(addDays(m, i))); };
const workDaysInWeek = (staffId, ds, shifts) => { const wk = new Set(monWeek(ds)); return new Set((shifts || S.shifts).filter(s => s.staffId === staffId && wk.has(s.date)).map(s => s.date)).size; };
const prefText = r => [r && Number(r.minHours) ? `1日${Number(r.minHours)}時間以上` : "", r && r.offPerWeek !== "" && r.offPerWeek != null ? `週${r.offPerWeek}日休み希望` : ""].filter(Boolean).join("・");
function reqsOnDay(ds) {
  const key = ds.slice(8, 10), out = [];
  for (const r of S.reqs) { if (r.month !== ds.slice(0, 7)) continue; const v = r.days?.[key]; if (v && v.k && staffById(r.staffId)) out.push({ staffId: r.staffId, ...v }); }
  return out;
}

/* 必要人数と不足 */
const NEED_DOW = [1, 2, 3, 4, 5, 6, 0];
const fmtT = m => (m >= 1440 ? "翌" : "") + clock(m);
const slotsFor = ds => ((S.staffing.byDow || {})[parseYmd(ds).getDay()] || []).filter(s => span(s) && Number(s.need) > 0);
// その日の時間帯ごとに、必要人数に届かない区間を { from, to, short, need } で返す（分は当日 0:00 起点）
function shortages(ds, shifts) {
  const slots = slotsFor(ds); if (!slots.length) return [];
  const d = parseYmd(ds), prev = ymd(addDays(d, -1)), next = ymd(addDays(d, 1)), iv = [];
  for (const s of shifts || S.shifts) {
    const off = s.date === ds ? 0 : s.date === prev ? -1440 : s.date === next ? 1440 : null; if (off === null) continue;
    const sp = span(s); if (sp) iv.push([sp.a + off, sp.b + off]);
  }
  const out = [];
  for (const sl of slots) {
    const sp = span(sl), need = Math.round(Number(sl.need)); let cur = null;
    for (let t = sp.a; t < sp.b; t += 5) {
      let c = 0; for (const [a, b] of iv) if (a <= t && t < b) c++;
      const sh = Math.max(0, need - c);
      if (cur && cur.short === sh) cur.to = Math.min(t + 5, sp.b);
      else { if (cur) out.push(cur); cur = sh > 0 ? { from: t, to: Math.min(t + 5, sp.b), short: sh, need } : null; }
    }
    if (cur) out.push(cur);
  }
  return out;
}
const shortText = s => `${fmtT(s.from)}–${fmtT(s.to)} ${s.short}人不足`;
// 募集中の枠（自動作成で埋まらなかった時間を保存したもの）。settings/openSlots.byDate["YYYY-MM-DD"] = [{ from, to, short }]
// 表示するのは、今もまだ人が足りていない部分だけ（あとでシフトを入れると消える）
function openOn(ds) {
  const saved = S.openSlots[ds]; if (!Array.isArray(saved) || !saved.length) return [];
  const sg = shortages(ds); if (!sg.length) return [];
  // 必要人数の時間帯が重なっていても 1 本にまとめる: 5 分ごとに「足りない人数の最大」を見て、同じ人数が続く所を 1 枠にする
  const lo = Math.min(...saved.map(o => o.from)), hi = Math.max(...saved.map(o => o.to)), out = [];
  let cur = null;
  for (let t = lo; t < hi; t += 5) {
    const inSaved = saved.some(o => o.from <= t && t < o.to);
    const n = inSaved ? Math.max(0, ...sg.filter(x => x.from <= t && t < x.to).map(x => x.short)) : 0;
    if (cur && cur.short === n) cur.to = t + 5;
    else { if (cur) out.push(cur); cur = n > 0 ? { from: t, to: t + 5, short: n } : null; }
  }
  if (cur) out.push(cur);
  return out;
}
const openText = o => `${fmtT(o.from)}–${fmtT(o.to)}`;
// お店の開始〜終了のうち、シフトが 1 人も入っていない区間を { from, to } で返す（分は当日 0:00 起点）
function emptyTimes(ds) {
  const o = Math.round((Number(S.settings.open) || 0) * 60), c = Math.max(Math.round((Number(S.settings.close) || 0) * 60), o + 60);
  const d = parseYmd(ds), prev = ymd(addDays(d, -1)), next = ymd(addDays(d, 1)), iv = [];
  for (const s of S.shifts) {
    const off = s.date === ds ? 0 : s.date === prev ? -1440 : s.date === next ? 1440 : null; if (off === null) continue;
    const sp = span(s); if (sp && sp.b + off > o && sp.a + off < c) iv.push([Math.max(o, sp.a + off), Math.min(c, sp.b + off)]);
  }
  iv.sort((a, b) => a[0] - b[0]);
  const out = []; let t = o;
  for (const [a, b] of iv) { if (a > t) out.push({ from: t, to: a }); t = Math.max(t, b); }
  if (t < c) out.push({ from: t, to: c });
  return out;
}
const emptyText = e => `${fmtT(e.from)}–${fmtT(e.to)}`;
// 表示中の月の「1 人もいない時間」の一覧
function renderEmpty() {
  const first = monthFirst(), dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate(), k = curYm(), today = ymd(new Date());
  const o = Math.round((Number(S.settings.open) || 0) * 60), c = Math.max(Math.round((Number(S.settings.close) || 0) * 60), o + 60);
  const part = [], none = [];
  for (let d = 1; d <= dim; d++) {
    const ds = `${k}-${pad(d)}`; if (S.emptyFuture && ds < today) continue;
    const e = emptyTimes(ds); if (!e.length) continue;
    if (e.length === 1 && e[0].from === o && e[0].to === c) none.push(ds); else part.push({ ds, e });
  }
  const total = part.length + none.length, dayBtn = ds => `<button class="linkbtn" data-act="pick" data-d="${ds}">${md(ds)}</button>`;
  let h = `<details class="empty-box" id="empty-box" ${S.emptyOpen === false ? "" : "open"}><summary id="empty-summary" data-act="emptyToggle">1人もいない時間<span class="hint">　${total ? `${total}日あります` : "ありません"}（お店の営業 ${fmtT(o)}–${fmtT(c)} のうち）</span></summary>`;
  h += `<label class="row hint" style="margin:6px 0"><input type="checkbox" data-bind="emptyFuture" ${S.emptyFuture ? "checked" : ""}> 今日より前の日は出さない</label>`;
  if (!total) return h + `<p class="need-ok">この月は、営業時間中いつもだれかが入っています。</p></details>`;
  if (part.length) h += `<ul class="empty-list">` + part.map(x => `<li>${dayBtn(x.ds)}<span class="need-ng">${x.e.map(emptyText).join("、")}</span></li>`).join("") + `</ul>`;
  if (none.length) h += `<p class="empty-none"><b>シフトが1件もない日（終日だれもいない）</b><br>${none.map(dayBtn).join(" ")}</p>`;
  return h + `</details>`;
}

/* ---------- render ---------- */
function render() {
  const fa = document.activeElement, fid = fa && fa.id, selStart = fa && "selectionStart" in fa ? (() => { try { return fa.selectionStart; } catch { return null; } })() : null;
  document.getElementById("store-name").textContent = S.settings.storeName || "";
  const meName = S.role === "member" ? (staffById(S.me)?.name || "") : "";
  document.getElementById("acct").innerHTML = S.dbState === "loading" ? `<span class="role">読み込み中</span>`
    : S.admin ? `<span class="role admin">管理者</span><button class="btn small" id="logout" data-act="logout">ログアウト</button>`
    : S.role === "member" ? `<span class="role">スタッフ${meName ? "：" + esc(meName) : ""}</span><button class="btn small" id="login" data-act="login" title="店長（管理者）の Google アカウントで入り直します">店長ログイン</button>`
    : S.authUser && !S.authUser.isAnonymous ? `<button class="btn small" id="logout" data-act="logout">ログアウト</button>` : "";
  const ready = S.dbState === "ready";
  const tabs = !ready ? [] : S.admin ? [TABS[0], ["reqcal", "希望カレンダー"], ...TABS.slice(1)] : TABS;
  if (S.tab === "reqcal" && !S.admin && ready) S.tab = "cal";
  document.getElementById("tabs").innerHTML = tabs.map(([k, l]) => `<button role="tab" id="tab-${k}" aria-selected="${S.tab === k}" data-act="tab" data-v="${k}">${l}</button>`).join("");
  let html = banners();
  if (ready) html += S.tab === "cal" ? renderCal() : S.tab === "reqcal" ? (S.admin ? renderReqCal() : "") : S.tab === "req" ? renderReq() : S.tab === "sum" ? renderSum() : renderStaff();
  else if (S.dbState !== "loading") html += renderGate();
  document.getElementById("main").innerHTML = html;
  document.getElementById("toast-root").innerHTML = S.toast ? `<div class="toast ${S.toast.err ? "err" : ""}" role="status">${esc(S.toast.text)}</div>` : "";
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (selStart != null) try { el.setSelectionRange(selStart, selStart); } catch {} } }
}

// 参加していない人に見せる入口（招待リンクの案内と、店長のログイン）
function renderGate() {
  if (S.dbState === "setup") return `<section class="panel gate"><h2>準備中です</h2><p class="muted">このページはまだ Firebase の設定が入っていません。設定ファイル（firebase-config.js）に Firebase の設定値を入れると使えるようになります。</p></section>`;
  let h = `<section class="panel gate"><h2>シフトボード</h2>`;
  if (S.gate && S.gate.kind === "err") h += `<div class="msg err" role="alert">${esc(S.gate.text)}</div>`;
  if (S.gate && S.gate.kind === "uid") {
    h += `<div class="msg err" role="alert">${S.gate.text ? esc(S.gate.text) + " は" : "このアカウントは"}管理者として登録されていません。</div>`;
    h += `<p class="hint">別のアカウントで入り直すときは、右上の「ログアウト」を押してください。</p>`;
  }
  h += `<p>スタッフの方は、<b>店長から届いた招待リンク</b>を開いてください。ログインは要りません。一度開けば、次からはこのページを開くだけで使えます。</p>
    <div class="gate-admin"><p class="hint">店長（管理者）の方はこちら</p><button class="btn" id="login" data-act="login">Google でログイン</button></div></section>`;
  return h;
}

function banners() {
  if (S.dbState === "loading") return `<div class="banner">シフトデータを読み込んでいます…</div>`;
  if (S.dbState !== "ready") return "";
  let b = "";
  if (S.dbErr) b += `<div class="banner err">${esc(S.dbErr)}</div>`;
  if (!S.staff.length) b += S.admin
    ? `<div class="banner warn"><span>まだスタッフが登録されていません。最初にスタッフの名前と時給を登録すると、シフトを組めるようになります。</span><button class="btn primary small" data-act="tab" data-v="staff">スタッフを登録する</button></div>`
    : `<div class="banner warn">管理者がスタッフを登録すると、ここにシフトが表示されます。</div>`;
  return b;
}

function monthNav(label) {
  return `<div class="nav"><button class="arrow" data-act="prevm" aria-label="前の月">‹</button><h2 class="period">${label}</h2><button class="arrow" data-act="nextm" aria-label="次の月">›</button><button class="btn small" data-act="today">今月</button></div>`;
}
const monthLabel = () => { const d = monthFirst(); return `${d.getFullYear()}年${d.getMonth() + 1}月`; };

/* カレンダー */
function renderCal() {
  let nav;
  if (S.calMode === "month") nav = monthNav(monthLabel());
  else { const ws = startOfWeek(selDate()), we = addDays(ws, 6); nav = `<div class="nav"><button class="arrow" data-act="prevw" aria-label="前の週">‹</button><h2 class="period">${ws.getMonth() + 1}/${ws.getDate()} – ${we.getMonth() + 1}/${we.getDate()}</h2><button class="arrow" data-act="nextw" aria-label="次の週">›</button><button class="btn small" data-act="today">今日</button></div>`; }
  return `<div class="cal-layout">
    <section class="panel">
      <div class="toolbar">${nav}
        <div class="row"><div class="seg" role="group" aria-label="表示切り替え"><button id="mode-month" data-act="mode" data-v="month" aria-pressed="${S.calMode === "month"}">月</button><button id="mode-week" data-act="mode" data-v="week" aria-pressed="${S.calMode === "week"}">週（シフト表）</button></div>${S.staff.length ? pdfButton("cal") + pdfMineButton() : ""}</div>
      </div>
      ${S.calMode === "month" ? monthGrid() : weekTable()}
      ${renderEmpty()}
    </section>
    <aside class="panel">${renderDay()}</aside>
  </div>`;
}

function monthGrid() {
  const first = monthFirst(), dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + dim) / 7), gs = startOfWeek(first), todayS = ymd(new Date());
  let h = `<div class="month">` + WD.map((w, i) => `<div class="wd d${i}">${w}</div>`).join("");
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gs, i), ds = ymd(d), out = d.getMonth() !== first.getMonth();
    const list = shiftsOn(ds);
    const op = out ? [] : openOn(ds);
    const chips = (op.length ? `<span class="chip open" title="${esc(op.map(o => `${openText(o)} ${o.short}人`).join(" / "))}">募集 <i>${shortT(clock(op[0].from))}-${op[0].to >= 1440 ? "翌" : ""}${shortT(clock(op[0].to))} ${op[0].short}人${op.length > 1 ? ` ほか${op.length - 1}` : ""}</i></span>` : "") + list.slice(0, 3).map(s => `<span class="chip" style="${colorVar(staffById(s.staffId))}">${esc(nameOf(s.staffId))} <i>${shortT(s.start)}-${shortT(s.end)}</i></span>`).join("")
      + (list.length > 3 ? `<span class="more">ほか${list.length - 3}人</span>` : "");
    const sg = out ? [] : shortages(ds);
    const shortBadge = sg.length && !op.length ? `<span class="short" title="${esc(sg.map(shortText).join(" / "))}">${sg[0].short}人不足<span class="det"> ${shortT(clock(sg[0].from))}-${sg[0].to >= 1440 ? "翌" : ""}${shortT(clock(sg[0].to))}${sg.length > 1 ? ` ほか${sg.length - 1}` : ""}</span></span>` : "";
    let rq = "";
    if (!out) { const r = reqsOnDay(ds); const c = k => r.filter(x => x.k === k).length; const parts = ["ok", "part", "ng"].filter(k => c(k)).map(k => `<span class="${k}">${MARK[k]}${c(k)}</span>`).join(""); if (parts) rq = `<span class="rq" title="希望シフト">${parts}</span>`; }
    h += `<button class="cell d${d.getDay()} ${out ? "out" : ""} ${ds === S.sel ? "sel" : ""} ${ds === todayS ? "today" : ""} ${sg.length ? "has-short" : ""}" id="cell-${ds}" data-act="pick" data-d="${ds}" aria-label="${d.getMonth() + 1}月${d.getDate()}日 シフト${list.length}件${sg.length ? "、" + sg.map(shortText).join("、") : ""}"><span class="dnum">${d.getDate()}</span>${shortBadge}<span class="chips">${chips}</span>${rq}</button>`;
  }
  return h + `</div>`;
}

function weekTable() {
  const ws = startOfWeek(selDate()), days = [...Array(7)].map((_, i) => ymd(addDays(ws, i)));
  if (!S.staff.length) return `<p class="muted">スタッフを登録すると、ここに 1 週間分のシフト表が表示されます。</p>`;
  let h = `<div class="scroll"><table class="week"><thead><tr><th class="name">スタッフ</th>`;
  h += days.map(ds => { const d = parseYmd(ds); const col = d.getDay() === 0 ? "var(--sun)" : d.getDay() === 6 ? "var(--sat)" : "inherit"; return `<th class="${ds === S.sel ? "sel" : ""}"><button id="wh-${ds}" data-act="pick" data-d="${ds}" style="color:${col}">${d.getMonth() + 1}/${d.getDate()} ${WD[d.getDay()]}</button></th>`; }).join("") + `</tr></thead><tbody>`;
  for (const st of S.staff) {
    h += `<tr><th class="name"><span class="dot" style="${colorVar(st)}"></span>${esc(st.name)}</th>`;
    for (const ds of days) {
      const sh = S.shifts.filter(s => s.date === ds && s.staffId === st.id).sort(byStart);
      const rq = reqsOnDay(ds).find(r => r.staffId === st.id);
      let c = sh.map(s => `<div class="wshift" style="${colorVar(st)}">${s.start}–${s.end}</div>`).join("");
      if (!c && rq) c = `<div class="wreq ${rq.k}">${MARK[rq.k]}${rq.k === "part" && rq.start ? ` ${rq.start}–${rq.end}` : ""}</div>`;
      h += `<td class="${ds === S.sel ? "sel" : ""}" data-act="pick" data-d="${ds}">${c}</td>`;
    }
    h += `</tr>`;
  }
  if (days.some(ds => openOn(ds).length)) h += `<tr><th class="name need-ng">募集中</th>` + days.map(ds => `<td class="${ds === S.sel ? "sel" : ""}" data-act="pick" data-d="${ds}">${openOn(ds).map(o => `<div class="chip open" style="white-space:normal">${openText(o)} ${o.short}人</div>`).join("")}</td>`).join("") + `</tr>`;
  h += `</tbody><tfoot><tr><td>人数 / 実働</td>` + days.map(ds => { const l = shiftsOn(ds); const w = l.reduce((a, s) => a + calc(s).work, 0); return `<td class="num">${l.length}人 / ${hrs(w)}</td>`; }).join("") + `</tr>`;
  const weekShort = days.map(shortages);
  if (weekShort.some(x => x.length)) h += `<tr class="shortrow"><td>人が足りない時間</td>` + weekShort.map(sg => `<td>${sg.map(s => `<div class="mono">${fmtT(s.from)}–${fmtT(s.to)}<br>${s.short}人不足</div>`).join("")}</td>`).join("") + `</tr>`;
  h += `</tfoot></table></div>`;
  return h;
}

function renderDay() {
  const d = selDate(), list = shiftsOn(S.sel), o = S.settings.open * 60, c = Math.max(S.settings.close * 60, o + 60), range = c - o;
  let h = `<div class="day-head"><h2>${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）</h2><span class="muted num">${list.length}人</span></div>`;
  // タイムライン
  let ticks = ""; const step = range > 14 * 60 ? 180 : 120;
  for (let t = Math.ceil(o / step) * step; t < c; t += step) ticks += `<div class="tick" style="left:${(t - o) / range * 100}%"><span>${t / 60 % 24}</span></div>`;
  const sg = shortages(S.sel), slots = slotsFor(S.sel);
  const zones = sg.map(s => { const L = Math.max(0, (s.from - o) / range * 100), R = Math.min(100, (s.to - o) / range * 100); return R > L ? `<div class="shortzone" style="left:${L}%;width:${R - L}%" title="${esc(shortText(s))}"></div>` : ""; }).join("");
  h += `<div class="timeline" aria-label="時間帯ごとの配置"><div class="ticks">${zones}${ticks}</div>`;
  h += list.length ? list.map(s => { const sp = span(s); if (!sp) return ""; const L = Math.max(0, (sp.a - o) / range * 100), R = Math.min(100, (sp.b - o) / range * 100); const st = staffById(s.staffId); return `<div class="bar" style="${colorVar(st)}"><div style="left:${L}%;width:${Math.max(R - L, 1)}%" title="${esc(nameOf(s.staffId))} ${s.start}–${s.end}">${esc(nameOf(s.staffId))}</div></div>`; }).join("") : `<div class="empty-tl">この日はまだシフトがありません。</div>`;
  h += `</div>`;
  // 店舗メモ・祝日
  const hol = jpHoliday(d), memo = S.dayMemos[S.sel] || "";
  if (S.admin) {
    h += `<div class="section-title">店舗メモ${hol ? `<span class="hint">　祝日（${esc(hol)}）</span>` : ""}</div>
      <div class="row"><input id="dm-text" data-bind="dmDraft" value="${esc(S.dmDraft ?? memo)}" maxlength="40" placeholder="例: 棚卸しのため 19:00 閉店" style="flex:1;min-width:0">
      <button class="btn small" id="dm-save" data-act="dmSave" type="button">保存</button></div>
      <p class="hint">シフト表の PDF の「店舗メモ」の行に出ます。祝日は自動で入ります。</p>`;
  } else if (memo || hol) h += `<div class="section-title">店舗メモ</div><p>${esc([hol && `祝日（${hol}）`, memo].filter(Boolean).join("　"))}</p>`;
  // 必要人数との比較
  h += `<div class="section-title">必要人数</div>`;
  if (!slots.length) h += `<p class="hint">${S.admin ? "「スタッフ・設定」タブで曜日ごとの必要人数を入れると、人が足りない時間をここに表示します。" : "この曜日の必要人数は設定されていません。"}</p>`;
  else {
    h += `<div class="reqgrp">` + slots.slice().sort((a, b) => span(a).a - span(b).a).map(sl => `<div class="reqline"><span class="mono">${sl.start}–${sl.end}</span><span>${Math.round(Number(sl.need))}人必要</span></div>`).join("");
    h += sg.length ? sg.map(s => `<div class="reqline need-ng">${fmtT(s.from)}–${fmtT(s.to)} が ${s.short}人不足（必要 ${s.need}人）</div>`).join("") : `<div class="reqline need-ok">すべての時間帯で足りています</div>`;
    h += `</div>`;
  }
  // 募集中の枠
  const op = openOn(S.sel);
  if (op.length) h += `<div class="section-title">募集中の枠</div>` + op.map((o, i) => `<div class="open-row"><span class="mono need-ng">${openText(o)}</span><span class="need-ng">あと${o.short}人</span>${S.admin ? `<button class="btn small" id="open-fill-${i}" data-act="openFill" data-a="${o.from}" data-b="${o.to}">人を決めて入れる</button>` : `<span class="hint">入れる人は店長に伝えてください</span>`}</div>`).join("")
    + (S.admin ? `<div class="row" style="margin-top:6px"><button class="btn small" id="open-del" data-act="openDel">この日の募集中の枠を消す</button></div>` : "");
  // 1 人もいない時間
  const em = emptyTimes(S.sel);
  h += `<div class="section-title">1人もいない時間</div><div class="reqgrp">${em.length ? em.map(e => `<div class="reqline need-ng">${emptyText(e)} はだれもいません</div>`).join("") : `<div class="reqline need-ok">営業時間中いつもだれかが入っています</div>`}</div>`;
  // シフト一覧
  if (list.length) {
    h += `<div class="section-title">シフト</div><ul class="slist">` + list.map(s => {
      const st = staffById(s.staffId), cc = calc(s);
      let ctl = "";
      if (S.admin) ctl = S.confirmDel === s.id
        ? `<span class="row"><button class="btn small danger" id="del-yes-${s.id}" data-act="delshift" data-id="${s.id}">削除する</button><button class="btn small" id="del-no-${s.id}" data-act="cancelDel">やめる</button></span>`
        : `<span class="row"><button class="btn small" id="edit-${s.id}" data-act="editshift" data-id="${s.id}">編集</button><button class="btn small" id="askdel-${s.id}" data-act="askDel" data-id="${s.id}">削除</button></span>`;
      const mw = minWorkOf(s.staffId), sp = span(s), off = offWeekOf(s.staffId), wd = workDaysInWeek(s.staffId, s.date);
      const warn = [mw && sp && sp.b - sp.a < mw ? `希望は1日${mw / 60}時間以上` : "", off != null && wd > 7 - off ? `この週は${wd}日勤務（希望は週${off}日休み＝${7 - off}日まで）` : ""].filter(Boolean);
      return `<li><span class="dot" style="${colorVar(st)}"></span><span><span class="who">${esc(nameOf(s.staffId))}</span> <span class="mono">${s.start}–${s.end}</span></span>${ctl}${warn.length ? `<span class="meta need-ng">⚠ ${esc(warn.join("／"))}</span>` : ""}
        <span class="meta">休憩 ${brkOf(s)}分${s.breakAuto ? "（決まりどおり）" : ""} ・ 実働 <span class="num">${hrs(cc.work)}</span>${cc.night ? ` ・ 深夜 <span class="num">${hrs(cc.night)}</span>` : ""}${s.note ? `<br>${esc(s.note)}` : ""}</span></li>`;
    }).join("") + `</ul>`;
  }
  // 希望
  const rq = reqsOnDay(S.sel);
  h += `<div class="section-title">この日の希望</div>`;
  if (!rq.length) h += `<p class="hint">提出された希望はありません。</p>`;
  else h += `<div class="reqgrp">` + ["ok", "part", "ng"].flatMap(k => rq.filter(r => r.k === k).map(r => {
    const already = list.some(s => s.staffId === r.staffId);
    const add = S.admin && k !== "ng" && !already ? `<button class="btn small" id="fill-${r.staffId}" data-act="fillFromReq" data-id="${r.staffId}">シフトに入れる</button>` : "";
    return `<div class="reqline"><span class="mark ${k}">${MARK[k]}</span><span class="dot" style="${colorVar(staffById(r.staffId))}"></span>${esc(nameOf(r.staffId))}${k === "part" && r.start ? ` <span class="mono muted">${r.start}–${r.end}</span>` : ""}${already ? `<span class="hint">配置済み</span>` : ""}${add}</div>`;
  })).join("") + `</div>`;
  // 追加フォーム
  if (S.admin && S.staff.length) {
    const f = S.form;
    if (!f.breakTouched) f.breakMin = suggestBreak(f.start, f.end);
    h += `<div class="section-title">${f.editing ? "シフトを編集" : "シフトを追加"}</div>
    <form class="form" id="shift-form" data-form="shift">
      <label class="f full">スタッフ<select id="f-staff" data-bind="form.staffId" required><option value="">選んでください</option>${S.staff.map(st => `<option value="${st.id}" ${st.id === f.staffId ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select></label>
      <label class="f">開始<input type="time" id="f-start" data-bind="form.start" value="${f.start}" required step="300"></label>
      <label class="f">終了<input type="time" id="f-end" data-bind="form.end" value="${f.end}" required step="300"></label>
      <label class="f">休憩（分）<input type="number" id="f-break" data-bind="form.breakMin" value="${f.breakMin}" min="0" step="1" inputmode="numeric"></label>
      <label class="f">メモ<input id="f-note" data-bind="form.note" value="${esc(f.note)}" placeholder="例: レジ担当"></label>
      <p class="hint full">終了が開始より早いと、日をまたぐ夜勤として計算します。休憩はお店の設定の決まり（${esc(breakRulesText())}）で自動で入ります。休憩を手で変えたシフトは、その分数のまま計算します。</p>
      <div class="row full"><button class="btn primary" id="f-submit" type="submit">${f.editing ? "変更を保存" : "追加する"}</button>${f.editing ? `<button class="btn" type="button" id="f-cancel" data-act="cancelEdit">やめる</button>` : ""}</div>
    </form>`;
  }
  h += gcalBox("day", list);
  return h;
}

/* カレンダーに入れる: シフトごとの Google カレンダー追加リンクと、まとめて取り込める .ics ファイル */
// JST の「その日の 0:00 から m 分後」を UTC の 20261007T010000Z 形式にする
function utcStamp(ds, m) {
  const [y, mo, d] = ds.split("-").map(Number);
  return new Date(Date.UTC(y, mo - 1, d, 0, m - 540)).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
}
const calTitle = s => `${nameOf(s.staffId)} シフト${S.settings.storeName ? `（${S.settings.storeName}）` : ""}`;
const calDetail = s => `休憩 ${brkOf(s)}分${s.note ? "\n" + s.note : ""}\nシフトボードより`;
function gcalLink(s) {
  const sp = span(s); if (!sp) return "#";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(calTitle(s))
    + "&dates=" + utcStamp(s.date, sp.a) + "/" + utcStamp(s.date, sp.b)
    + "&details=" + encodeURIComponent(calDetail(s));
}
function icsText(list) {
  const escI = t => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//shift-board//JA", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  for (const s of list) {
    const sp = span(s); if (!sp) continue;
    lines.push("BEGIN:VEVENT", `UID:${s.id}@shift-board`, `DTSTAMP:${now}`, `DTSTART:${utcStamp(s.date, sp.a)}`, `DTEND:${utcStamp(s.date, sp.b)}`,
      `SUMMARY:${escI(calTitle(s))}`, `DESCRIPTION:${escI(calDetail(s))}`, "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}
function calWho() { return S.gcal.who || (S.role === "member" ? S.me : "all"); }
function gcalBox(scope, all) {
  const who = calWho(), list = all.filter(s => who === "all" || s.staffId === who);
  let h = `<div class="gcal"><h3>カレンダーに入れる</h3>
    <p class="hint">${scope === "day" ? "この日" : "この月"}のシフトを、自分の Google カレンダーやスマホのカレンダーに入れられます。</p>
    <label class="f">だれのシフト<select id="gcal-who-${scope}" data-bind="gcal.who"><option value="all" ${who === "all" ? "selected" : ""}>全員</option>${S.staff.map(st => `<option value="${st.id}" ${who === st.id ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select></label>`;
  if (!list.length) return h + `<p class="hint">対象のシフトはありません。</p></div>`;
  if (scope === "day") h += `<div class="reqgrp">` + list.map(s => `<div class="reqline"><span class="dot" style="${colorVar(staffById(s.staffId))}"></span>${esc(nameOf(s.staffId))} <span class="mono">${s.start}–${s.end}</span><a class="btn small" href="${esc(gcalLink(s))}" target="_blank" rel="noopener">Google カレンダーに追加</a></div>`).join("") + `</div>`;
  h += `<div><button class="btn" id="ics-${scope}" data-act="ics" data-scope="${scope}">${list.length} 件をカレンダー用ファイル（.ics）で保存</button></div>
    <p class="hint">.ics ファイルは、パソコンの Google カレンダーの「設定 → インポート」で取り込めます。iPhone ではファイルを開くとカレンダーに追加できます。シフトが変わったときは、カレンダー側の予定も直してください。</p></div>`;
  return h;
}
function saveIcs(scope) {
  const who = calWho(), all = scope === "day" ? shiftsOn(S.sel) : shiftsInMonth(), list = all.filter(s => who === "all" || s.staffId === who);
  if (!list.length) return;
  const name = `シフト_${scope === "day" ? S.sel : curYm()}${who !== "all" ? "_" + nameOf(who) : ""}.ics`;
  downloadBlob(new Blob([icsText(list)], { type: "text/calendar" }), name);
  toast("カレンダー用ファイルを保存しました");
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* 招待リンク */
function newToken() {
  const b = new Uint8Array(24); crypto.getRandomValues(b);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
// 招待リンクは、どこで作っても公開用のアドレスにする（localhost で作ってもスタッフが開けるように）
const pageUrl = () => ((window.SHIFT_CONFIG && window.SHIFT_CONFIG.publicUrl) || `${location.origin}${location.pathname}`);
const inviteUrl = id => S.tokens[id] ? `${pageUrl()}#join=${id}.${S.tokens[id]}` : "";
function copyText(el) {
  if (!el) return;
  const done = () => toast("コピーしました");
  const fallback = () => { el.focus(); el.select(); toast("選択しました。長押しかCtrl+Cでコピーしてください"); };
  try { navigator.clipboard.writeText(el.value).then(done, fallback); } catch { fallback(); }
}

/* 希望シフト */
function renderReq() {

  let h = `<section class="panel"><div class="toolbar">${monthNav(monthLabel() + "の希望")}${dl ? `<span class="hint">提出期限 ${prev.getMonth() + 1}月${dl}日</span>` : ""}</div>`;
  if (!S.staff.length) return h + `<p class="muted">スタッフが登録されると、ここから希望シフトを出せます。</p></section>` + matrix();

const PDF = {

function drawGrid(pages, o) {

    g.font = `400 26px ${F}`; g.fillStyle = C.muted; g.fillText(o.subtitle, M, M + 80);

function pdfErrText(e) {

    case "too_large": return "PDF が大きすぎて保存できませんでした。";
    case "rejected_extension": case "extension_not_enabled": return "この画面では PDF を保存できません。";
    case "unavailable": case "not_granted": case "capability_disabled": case "capability_removed": return "この画面ではファイルを保存できません。claude.ai で開くと保存できます。";
    default: return "PDF を保存できませんでした。もう一度お試しください。";

async function savePdf(kind) {
  if (S.pdfBusy) return;
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("PDF を作る部品を読み込めませんでした。ページを開き直してください。", true); return; }
  S.pdfBusy = true; render();
  try {
    try { await Promise.all([document.fonts.load(`700 30px "Zen Kaku Gothic New"`, "希望"), document.fonts.load(`500 26px "Zen Kaku Gothic New"`, "希望"), document.fonts.load(`400 26px "Zen Kaku Gothic New"`, "希望"), document.fonts.load(`600 26px "IBM Plex Mono"`, "0")]); } catch {}
    const pages = [];
    const sid = kind === "mine" ? mineWho() : "";
    if (kind === "mine" && !sid) throw new Error("no staff");
    if (kind === "req") drawReqPages(pages); else if (kind === "mine") drawMinePages(pages, sid); else drawSharePages(pages);
    const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    pages.forEach((cv, i) => { if (i) pdf.addPage(); pdf.addImage(cv.toDataURL("image/png"), "PNG", 0, 0, 297, 210, undefined, "FAST"); });
    const f = monthFirst(), store = (S.settings.storeName || "").replace(/[\\/:*?"<>|\s]+/g, "");
    downloadBlob(pdf.output("blob"), kind === "req" ? `希望シフト_${curYm()}.pdf` : kind === "mine" ? `${nameOf(sid).replace(/[\\/:*?"<>|\s]+/g, "")}_${f.getFullYear()}年${f.getMonth() + 1}月シフト.pdf` : `${store ? store + "_" : ""}${f.getFullYear()}年${f.getMonth() + 1}月シフト.pdf`);
    S.pdfBusy = false;
    toast("PDF を保存しました");
  } catch (e) {
    S.pdfBusy = false;
    if (!(e && e.code === "declined")) toast(pdfErrText(e), true);
  } finally { S.pdfBusy = false; render(); }
}

async function autoApply() {
  const p = S.auto.plan; if (!p || !(p.added.length || p.unfilled.length || (p.removed && p.removed.length)) || S.auto.running) return;
  if (p.month !== curYm()) return;
  S.auto.running = true; S.auto.confirm = false; let done = 0;
  S.auto.msg = { kind: "", text: `0 / ${p.added.length} 件を保存しました…` }; render();
  try {
    for (const s of p.added) {
      if (s._upd) await S.db.doc(`shifts/${s._upd}`).update({ start: s.start, end: s.end, updatedAt: Date.now() });
      else await S.db.collection("shifts").add({ date: s.date, staffId: s.staffId, start: s.start, end: s.end, breakMin: s.breakMin, breakAuto: true, note: "", auto: true, updatedAt: Date.now() });
      done++; S.auto.msg = { kind: "", text: `${done} / ${p.added.length} 件を保存しました…` }; render();
    }
    // 新しい案を保存し終えてから、作り直した古い自動シフトを消す（途中で止まっても空にならないように）
    let gone = 0;
    for (const s of p.removed || []) { await S.db.doc(`shifts/${s.id}`).delete(); gone++; }
    // 足りない時間を募集中の枠として保存（この月で案の対象にした日の分は入れ替える）
    const m = { ...S.openSlots }, today = ymd(new Date());
    for (const k of Object.keys(m)) if (k.startsWith(p.month) && !(S.auto.skipPast && k < today)) delete m[k];
    for (const u of p.unfilled) m[u.ds] = u.sg.map(x => ({ from: x.from, to: x.to, short: x.short }));
    await S.db.doc("settings/openSlots").set({ byDate: m, updatedAt: Date.now() });
    S.auto.msg = { kind: "ok", text: `${gone ? `前に自動で作った ${gone} 件を消しました。` : ""}${done ? `${done} 件のシフトを保存しました。` : ""}${p.unfilled.length ? `足りない時間（${p.unfilled.length} 日分）は「募集中」としてカレンダーに出しました。` : ""}カレンダーで確認・修正できます。` }; S.auto.plan = null;
  } catch (e) { S.auto.msg = { kind: "err", text: `${done} 件を保存したところで止まりました。${dbErrText(e)}` }; S.auto.plan = null; }
  S.auto.running = false; render();
}

function toast(text, err) { S.toast = { text, err }; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, err ? 6000 : 2600); }
function dbErrText(e) {
  switch (e && e.code) {
    case "permission-denied": return "保存できませんでした。この操作をする権限がありません。";
    case "invalid-argument": return "保存できませんでした。入力内容を確かめてください。";
    case "resource-exhausted": return "保存できる量か回数の上限に達しました。少し待ってから、もう一度お試しください。";
    case "unauthenticated": return "ログインが切れました。ページを開き直してください。";
    case "unavailable": return "通信できませんでした。電波の良い場所で、もう一度お試しください。";
    default: return "保存できませんでした。通信状況を確かめて、もう一度お試しください。";
  }
}
async function write(fn, ok) { if (!S.db) { toast("シフトデータに接続できていないため保存できません。", true); return false; } try { await fn(); if (ok) toast(ok); return true; } catch (e) { toast(dbErrText(e), true); return false; } }

function moveMonth(n) { const f = monthFirst(), t = new Date(f.getFullYear(), f.getMonth() + n, 1), td = new Date(); setSel(ymOf(t) === ymOf(td) ? ymd(td) : ymd(t)); S.req.dirty = false; loadReqDraft(); }

function loadReqDraft() {
  const r = S.req, doc = r.staffId ? reqOf(r.staffId) : null;
  r.days = doc && doc.days ? JSON.parse(JSON.stringify(doc.days)) : {}; r.note = (doc && doc.note) || ""; r.dirty = false;
  // 曜日ごとの希望: その月に出したもの → この端末で前に決めたもの の順に使う
  let saved = null; try { saved = JSON.parse(pref.get("weekly." + r.staffId, "null")); } catch {}
  r.weekly = doc && doc.weekly ? JSON.parse(JSON.stringify(doc.weekly)) : (saved && typeof saved === "object" ? saved : {});
  r.weeklyOpen = undefined;
  let pf = null; try { pf = JSON.parse(pref.get("prefs." + r.staffId, "null")); } catch {}
  r.minHours = doc && doc.minHours != null ? String(doc.minHours || "") : (pf && pf.minHours) || "";
  r.offPerWeek = doc && doc.offPerWeek != null ? String(doc.offPerWeek) : (pf && pf.offPerWeek) || "";
}
// 曜日ごとの希望から、未定・時間のない行を除いた保存用の形
function cleanWeekly(w) {
  const out = {};
  for (const [dw, v] of Object.entries(w || {})) {
    if (!v || !v.k) continue;
    if (v.k === "part") { if (v.start && v.end) out[dw] = { k: "part", start: v.start, end: v.end }; }
    else out[dw] = { k: v.k };
  }
  return out;
}

  o[parts[parts.length - 1]] = value;
}
document.addEventListener("input", e => {
  const t = e.target, b = t.dataset && t.dataset.bind; if (!b || t.tagName === "SELECT" || t.type === "checkbox") return;
  if (b.startsWith("setf.")) setfDraft();
  if (b.startsWith("need.")) needDraft();
  setBind(b, t.value);
  if (b.startsWith("req.")) S.req.dirty = true;
  if (b === "form.breakMin") S.form.breakTouched = true;
});
document.addEventListener("change", e => {
  const t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
  if (b.startsWith("setf.")) setfDraft();
  if (b.startsWith("need.")) needDraft();
  setBind(b, t.type === "checkbox" ? t.checked : t.value);
  if ((b === "form.start" || b === "form.end") && !S.form.breakTouched) S.form.breakMin = suggestBreak(S.form.start, S.form.end);
  if (b === "req.staffId") { pref.set("me", S.req.staffId); loadReqDraft(); }
  if (b.startsWith("req.days") || b.startsWith("req.weekly") || b === "req.minHours" || b === "req.offPerWeek") S.req.dirty = true;
  if (b === "gcal.who") { S.gcal.confirm = null; S.gcal.msg = null; }
  if (t.tagName === "SELECT" || t.type === "checkbox" || t.type === "time" || b === "form.breakMin" || b.startsWith("need.")) render();
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === "shift") {
    const f = S.form;
    if (!f.staffId) return toast("スタッフを選んでください。", true);
    if (!span(f)) return toast("開始と終了の時刻を入れてください。", true);
    const dup = S.shifts.find(s => s.date === S.sel && s.staffId === f.staffId && s.id !== f.editing);
    const auto = !f.breakTouched;
    const data = { date: S.sel, staffId: f.staffId, start: f.start, end: f.end, breakMin: auto ? suggestBreak(f.start, f.end) : Math.max(0, Number(f.breakMin) || 0), breakAuto: auto, note: f.note.trim(), updatedAt: Date.now() };
    const ok = await write(() => f.editing ? S.db.doc("shifts/" + f.editing).set(data) : S.db.collection("shifts").add(data), f.editing ? "シフトを変更しました" : (dup ? "シフトを追加しました（同じ日に 2 回目の勤務です）" : "シフトを追加しました"));
    if (ok) S.form = { ...blankForm(), start: f.start, end: f.end, breakMin: f.breakMin, breakTouched: f.breakTouched };
  } else if (kind === "staff") {
    const f = S.sf, name = f.name.trim();
    if (!name) return toast("名前を入れてください。", true);
    const data = { name, color: f.color, order: f.id ? (staffById(f.id)?.order ?? Date.now()) : Date.now() };
    const priv = { wage: f.wage === "" ? null : Math.max(0, Math.round(Number(f.wage))), email: f.email.trim() || null, desiredPay: String(f.desired ?? "").trim() === "" ? null : Math.max(0, Math.round(Number(f.desired))) };
    const ok = await write(async () => {
      const ref = f.id ? S.db.doc("staff/" + f.id) : S.db.collection("staff").doc();
      await ref.set(data);
      await S.db.doc("private/" + ref.id).set(priv);
      if (!f.id) await S.db.doc("staffTokens/" + ref.id).set({ token: newToken() });
    }, f.id ? "スタッフを更新しました" : `${name}さんを追加しました。下の一覧から招待リンクをコピーして送れます`);
    if (ok) S.sf = { id: null, name: "", wage: "", color: (S.staff.length + (f.id ? 0 : 1)) % 8, email: "", desired: "" };
  } else if (kind === "settings") {
    const f = S.setf || S.settings;
    const oMin = hmToMin(hoursToHm(f.open)), cMinRaw = hmToMin(hoursToHm(f.close));
    if (oMin == null || cMinRaw == null) return toast("タイムラインの開始と終了の時刻を入れてください。", true);
    // 終了が開始以前なら翌日の時刻とみなす。表示できるのは翌朝 6 時まで
    const cMin = cMinRaw <= oMin ? cMinRaw + 1440 : cMinRaw;
    if (cMin > 30 * 60) return toast("終了は翌朝 6:00 までにしてください。", true);
    if (cMin - oMin < 60) return toast("開始と終了は 1 時間以上あけてください。", true);
    const open = oMin / 60, close = cMin / 60;
    // 休憩の決まり: 空の行は無視し、半端な行はとめる
    const rules = [];
    for (const [i, r] of brRows(f).entries()) {
      const hs = String(r.h ?? "").trim(), bs = String(r.b ?? "").trim();
      if (!hs && !bs) continue;
      const overMin = Math.round(Number(hs) * 60), breakMin = Math.round(Number(bs));
      if (!(overMin > 0 && overMin <= 1440) || !(breakMin > 0 && breakMin <= 240)) return toast(`休憩の決まりの ${i + 1} 行目を確かめてください（時間は 0 より大きく、休憩は 1〜240 分）。`, true);
      rules.push({ overMin, breakMin });
    }
    rules.sort((a, b) => a.overMin - b.overMin);
    const data = { storeName: String(f.storeName || "").trim(), deadlineDay: Math.min(31, Math.max(1, Number(f.deadlineDay) || 20)), open, close, breakRules: rules };
    const ok = await write(() => S.db.doc("settings/main").set(data), "設定を保存しました");
    if (ok) S.setf = null;
  }
  render();
});

/* ---------- data ---------- */
let unsubShifts = null, unsubReqs = null, subKey = "", unsubs = [];
function onDbErr(e) { S.dbErr = e && e.code === "permission-denied" ? "このページを見る権限がなくなりました。店長から新しい招待リンクをもらってください。" : "データの更新が止まりました。ページを開き直してください。"; render(); }
function stopAll() {
  for (const u of unsubs) u(); unsubs = [];
  if (unsubShifts) unsubShifts(); if (unsubReqs) unsubReqs(); unsubShifts = unsubReqs = null; subKey = "";
}
function subscribeMonth() {
  if (!S.db) return; const key = curYm(); if (key === subKey) return; subKey = key;
  if (unsubShifts) unsubShifts(); if (unsubReqs) unsubReqs();
  const gs = startOfWeek(monthFirst()), ge = addDays(gs, 42);
  unsubShifts = S.db.collection("shifts").where("date", ">=", ymd(gs)).where("date", "<", ymd(ge)).onSnapshot(snap => { S.shifts = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onDbErr);
  unsubReqs = S.db.collection("requests").where("month", "==", key).onSnapshot(snap => { S.reqs = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.req.dirty) loadReqDraft(); render(); }, onDbErr);
}

// データの購読を始める（管理者か、招待リンクで参加したスタッフだけが読める）
function startData() {
  const db = S.db; stopAll(); S.dbState = "ready"; S.dbErr = "";
  unsubs.push(db.collection("staff").onSnapshot(snap => {
    S.staff = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (S.req.staffId && !staffById(S.req.staffId)) S.req.staffId = S.role === "member" ? S.me : "";
    if (!S.sf.id && !S.sf.name) S.sf.color = S.staff.length % 8;
    render();
  }, onDbErr));
  if (S.admin) {
    unsubs.push(db.collection("private").onSnapshot(snap => { const p = {}; for (const d of snap.docs) p[d.id] = d.data(); S.priv = p; render(); }, onDbErr));
    unsubs.push(db.collection("staffTokens").onSnapshot(snap => { const t = {}; for (const d of snap.docs) t[d.id] = d.data().token; S.tokens = t; render(); }, onDbErr));
  }
  unsubs.push(db.doc("settings/staffing").onSnapshot(snap => { S.staffing = snap.exists && snap.data().byDow ? { byDow: snap.data().byDow } : { byDow: {} }; render(); }, onDbErr));
  unsubs.push(db.doc("settings/main").onSnapshot(snap => { if (snap.exists) S.settings = { ...S.settings, ...snap.data() }; render(); }, onDbErr));
  // 日ごとの店舗メモ（PDF の「店舗メモ」行に出す）。settings/dayMemos.byDate["YYYY-MM-DD"]
  unsubs.push(db.doc("settings/openSlots").onSnapshot(snap => { S.openSlots = (snap.exists && snap.data().byDate) || {}; render(); }, onDbErr));
  unsubs.push(db.doc("settings/dayMemos").onSnapshot(snap => { S.dayMemos = (snap.exists && snap.data().byDate) || {}; render(); }, onDbErr));
  subscribeMonth();
  render();
}

// 招待リンク: #join=<スタッフID>.<合言葉>
function readJoin() {
  const m = /^#join=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(location.hash || "");
  return m ? { staffId: m[1], token: m[2] } : null;
}
function clearHash() { try { history.replaceState(null, "", location.pathname + location.search); } catch {} }

render();
(function boot() {
  const cfg = window.SHIFT_CONFIG || {};
  if (!window.firebase || !cfg.firebase || !cfg.firebase.apiKey) { S.dbState = "setup"; render(); return; }
  firebase.initializeApp(cfg.firebase);
  const auth = firebase.auth(), db = firebase.firestore();
  S.auth = auth; S.db = db; S.adminEmail = (cfg.adminEmail || "").toLowerCase();
  // 管理者は、設定したアドレスで Google ログインした人だけ（ルール側でも同じ条件で守る）
  const isAdminUser = u => !!S.adminEmail && !u.isAnonymous && u.emailVerified && (u.email || "").toLowerCase() === S.adminEmail
    && u.providerData.some(p => p && p.providerId === "google.com");
  let join = readJoin();
  auth.onAuthStateChanged(async u => {
    stopAll(); S.authUser = u; S.admin = false; S.role = "guest"; S.me = ""; S.gate = null;
    if (!u) {
      if (join) { try { await auth.signInAnonymously(); } catch (e) { S.dbState = "guest"; S.gate = { kind: "err", text: "参加の準備に失敗しました。通信状況を確かめて、招待リンクを開き直してください。" }; render(); } return; }
      S.dbState = "guest"; render(); return;
    }
    if (isAdminUser(u)) { S.admin = true; S.role = "admin"; join = null; clearHash(); startData(); return; }
    S.dbState = "loading"; render();
    if (join) {
      try {
        await db.doc("sessions/" + u.uid).set({ staffId: join.staffId, token: join.token, createdAt: Date.now() });
        pref.set("me", join.staffId);
      } catch (e) {
        S.dbState = "guest"; S.gate = { kind: "err", text: "この招待リンクは使えません。リンクが古いか、途中で切れている可能性があります。店長から新しいリンクをもらってください。" };
        join = null; clearHash(); render(); return;
      }
      join = null; clearHash();
    }
    let ses = null; try { ses = await db.doc("sessions/" + u.uid).get(); } catch {}
    if (ses && ses.exists) { S.role = "member"; S.me = ses.data().staffId; S.req.staffId = S.me; pref.set("me", S.me); startData(); return; }
    S.dbState = "guest";
    if (!u.isAnonymous) S.gate = { kind: "uid", text: u.email || "" };
    render();
  });
})();
</script>
